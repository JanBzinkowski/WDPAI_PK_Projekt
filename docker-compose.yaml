services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app/
    depends_on:
      - php
    networks:
      - pg-network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wdpai}
      POSTGRES_USER: ${POSTGRES_USER:-wdpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wdpai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wdpai} -d $${POSTGRES_DB:-wdpai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pg-network
    volumes:
      - ./docker/db:/docker-entrypoint-initdb.d
      - pg-data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - pg-network

  # ollama:
  #   image: ollama/ollama:latest
  #   gpus: all
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - pg-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - pg-network

  pgadmin-wdpai:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-pg-admin}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@wdpai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pg-network

networks:
  pg-network:

volumes:
  pg-data:
  # ollama_data: